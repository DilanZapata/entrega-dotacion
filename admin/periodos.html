<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Periodos de Dotación - Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { primary: '#f15a24' } } } } }
    </script>
    <style>body { font-family: 'Public Sans', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="min-h-screen text-slate-900">
    <div id="adminNav"></div>

    <main class="max-w-4xl mx-auto p-6 space-y-6">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-black text-slate-800">Periodos de Dotación</h1>
                <p class="text-slate-500 text-sm">Crea, edita, activa o elimina los periodos de entrega.</p>
            </div>
            <button onclick="abrirModal()" class="bg-brand-primary text-white font-bold px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2 shrink-0">
                <span class="material-symbols-outlined text-base">add</span> Nuevo Periodo
            </button>
        </div>

        <div id="lista" class="space-y-3"></div>
    </main>

    <!-- Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/50 z-30 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 space-y-4">
            <h2 id="modalTitulo" class="text-lg font-bold">Nuevo Periodo</h2>
            <input type="hidden" id="fId">
            <div class="space-y-1">
                <label class="text-sm font-medium text-slate-700">Nombre del periodo</label>
                <input id="fNombre" class="w-full rounded-xl border-slate-200 py-2.5 px-3" placeholder="Ej: Periodo 2026 - II">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-sm font-medium text-slate-700">Fecha inicio</label>
                    <input id="fInicio" type="date" class="w-full rounded-xl border-slate-200 py-2.5 px-3">
                </div>
                <div class="space-y-1">
                    <label class="text-sm font-medium text-slate-700">Fecha fin</label>
                    <input id="fFin" type="date" class="w-full rounded-xl border-slate-200 py-2.5 px-3">
                </div>
            </div>
            <div class="space-y-1">
                <label class="text-sm font-medium text-slate-700">Estado</label>
                <select id="fEstado" class="w-full rounded-xl border-slate-200 py-2.5 px-3 bg-white">
                    <option value="planificado">Planificado</option>
                    <option value="activo">Activo</option>
                    <option value="cerrado">Cerrado</option>
                </select>
                <p class="text-xs text-slate-400">Al activar un periodo, cualquier otro periodo activo se cerrará automáticamente.</p>
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="cerrarModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl">Cancelar</button>
                <button onclick="guardarPeriodo()" class="flex-1 bg-brand-primary text-white font-bold py-2.5 rounded-xl">Guardar</button>
            </div>
        </div>
    </div>

    <script src="../js/admin-guard.js"></script>
    <script src="../js/admin-nav.js"></script>
    <script src="../js/app.js"></script>
    <script>
        renderAdminNav('periodos');
        let periodos = [];

        function badge(estado) {
            const map = {
                activo: 'bg-green-100 text-green-700',
                cerrado: 'bg-slate-100 text-slate-500',
                planificado: 'bg-blue-100 text-blue-700',
            };
            return `<span class="px-2 py-0.5 rounded text-[10px] font-black uppercase ${map[estado] || map.planificado}">${estado}</span>`;
        }

        async function cargar() {
            periodos = await apiGet('../api/periodos.php');
            const cont = document.getElementById('lista');
            if (!periodos.length) {
                cont.innerHTML = '<p class="text-center text-slate-400 py-10">No hay periodos creados todavía.</p>';
                return;
            }
            cont.innerHTML = periodos.map(p => `
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex items-center justify-between gap-4">
                    <div>
                        <div class="flex items-center gap-2 mb-1">${badge(p.estado)}<h3 class="font-bold text-slate-800">${p.nombre}</h3></div>
                        <p class="text-xs text-slate-400">${p.fecha_inicio || '—'} → ${p.fecha_fin || '—'} · ID: ${p.id}</p>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick='editarPeriodo(${JSON.stringify(p.id)})' class="p-2 rounded-lg hover:bg-slate-100 text-slate-500" title="Editar">
                            <span class="material-symbols-outlined">edit</span>
                        </button>
                        <button onclick='eliminarPeriodo(${JSON.stringify(p.id)}, ${JSON.stringify(p.nombre)})' class="p-2 rounded-lg hover:bg-red-50 text-red-500" title="Eliminar">
                            <span class="material-symbols-outlined">delete</span>
                        </button>
                    </div>
                </div>`).join('');
        }

        function abrirModal() {
            document.getElementById('modalTitulo').innerText = 'Nuevo Periodo';
            document.getElementById('fId').value = '';
            document.getElementById('fNombre').value = '';
            document.getElementById('fInicio').value = '';
            document.getElementById('fFin').value = '';
            document.getElementById('fEstado').value = 'planificado';
            document.getElementById('modal').classList.remove('hidden');
        }

        function editarPeriodo(id) {
            const p = periodos.find(x => x.id === id);
            if (!p) return;
            document.getElementById('modalTitulo').innerText = 'Editar Periodo';
            document.getElementById('fId').value = p.id;
            document.getElementById('fNombre').value = p.nombre;
            document.getElementById('fInicio').value = p.fecha_inicio || '';
            document.getElementById('fFin').value = p.fecha_fin || '';
            document.getElementById('fEstado').value = p.estado;
            document.getElementById('modal').classList.remove('hidden');
        }

        function cerrarModal() { document.getElementById('modal').classList.add('hidden'); }

        async function guardarPeriodo() {
            const id = document.getElementById('fId').value;
            const payload = {
                nombre: document.getElementById('fNombre').value.trim(),
                fecha_inicio: document.getElementById('fInicio').value,
                fecha_fin: document.getElementById('fFin').value,
                estado: document.getElementById('fEstado').value,
            };
            if (!payload.nombre) return alert('El nombre es obligatorio.');

            try {
                if (id) {
                    payload.id = id;
                    await apiSend('../api/periodos.php', 'PUT', payload);
                } else {
                    await apiSend('../api/periodos.php', 'POST', payload);
                }
                cerrarModal();
                cargar();
            } catch (e) {
                alert('No se pudo guardar: ' + e.message);
            }
        }

        async function eliminarPeriodo(id, nombre) {
            if (!confirm(`¿Eliminar el periodo "${nombre}"? Esta acción no se puede deshacer.`)) return;
            try {
                await apiSend('../api/periodos.php', 'DELETE', { id });
                cargar();
            } catch (e) {
                alert('No se pudo eliminar: ' + e.message);
            }
        }

        cargar();
    </script>
</body>
</html>
